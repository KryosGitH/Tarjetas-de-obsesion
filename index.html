<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu sobre sorpresa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0c0c0c;--ink:#e9e4d8;--mute:#7f7a70;--line:#2a2927;--gold:#c9a45c;--r:387/696;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Jost',system-ui,Helvetica,Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1d1c1a,var(--bg) 65%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;text-align:center;overflow-x:hidden}
nav{display:flex;gap:30px;justify-content:center;padding:22px 16px 6px}
nav button{font:inherit;font-size:.95rem;letter-spacing:.04em;background:none;color:var(--mute);border:0;border-bottom:1px solid transparent;padding:6px 2px;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--gold)}
.view{display:none;padding:18px 16px 50px}.view.on{display:block}
h1{font-family:var(--serif);font-weight:300;font-size:2.1rem;margin:10px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* carta */
.card{width:min(250px,64vw);aspect-ratio:var(--r);position:relative;perspective:900px;display:inline-block;border-radius:4.3%/2.4%}
.inner{position:absolute;inset:0;border-radius:4.3%/2.4%;transform-style:preserve-3d;transition:transform .15s;transform:rotateY(180deg)}
.card.up .inner{transform:rotateY(0)}
.card.flipping .inner{transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.face,.back{position:absolute;inset:0;border-radius:4.3%/2.4%;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg);background:#111;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:2.4rem;font-family:var(--serif)}
.back::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.35);border-radius:7px}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:3rem}
.shine,.pearl,.spark{position:absolute;inset:0;pointer-events:none;opacity:0}
.shine{mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.7) 45%,rgba(255,235,170,.55) 55%,transparent 80%);background-size:250% 250%;background-position:var(--mx,0%) var(--my,0%)}
.card.up:hover .shine{opacity:.35}
.card:not(.up) .shine,.card:not(.up) .pearl,.card:not(.up) .spark,.card.flipping .shine,.card.flipping .pearl,.card.flipping .spark,.card:not(.up) .face::after,.card.flipping .face::after{display:none}
.tag{position:absolute;left:0;right:0;bottom:0;padding:7px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:var(--serif);font-style:italic;font-size:.95rem;display:none}
/* dorada */
.gold .face img,.gold .ph{filter:sepia(.75) saturate(1.6) brightness(1.08) contrast(1.05)}
.gold.up:not(.flipping){filter:drop-shadow(0 0 12px rgba(201,164,92,.55))}
.gold .shine{opacity:.85}.gold .tag{display:block;color:var(--gold)}
/* prismatica */
.prism .face img,.prism .ph{filter:saturate(1.1) brightness(1.14) contrast(1.05)}
.prism.up:not(.flipping){filter:drop-shadow(0 0 14px rgba(190,170,255,.65))}
.prism .pearl{opacity:.6;mix-blend-mode:color;background:conic-gradient(from calc(var(--a,0)*1deg),#ff9ad5,#ffe29a,#9affd4,#9ad0ff,#c79aff,#ff9ad5);animation:hue 7s linear infinite}
.prism .face::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,225,245,.15) 40%,rgba(205,240,255,.5))}
.prism .shine{opacity:1;mix-blend-mode:color-dodge;background-size:220% 220%}
.prism .spark{opacity:.9;mix-blend-mode:color-dodge;background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2.5px),radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 3px),radial-gradient(circle at 45% 85%,#fff 0 1px,transparent 2.5px);background-size:61px 67px,83px 79px,47px 53px;animation:twinkle 2.2s ease-in-out infinite alternate}
.prism .spark::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,#fff 0 1px,transparent 2.5px),radial-gradient(circle at 30% 55%,#fff 0 1.5px,transparent 3px);background-size:71px 59px,53px 89px;animation:twinkle 1.7s ease-in-out -.8s infinite alternate}
.prism .tag{display:block;color:#fff}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.prism .spark,.prism .spark::after{display:none!important}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}

/* sobre */
#stage{min-height:430px;display:grid;place-items:center;position:relative;margin:8px 0}
.pack{width:min(200px,54vw);aspect-ratio:5/8;position:relative;cursor:pointer;animation:float 4s ease-in-out infinite}
.ptop,.pbody{position:absolute;left:0;right:0;background:linear-gradient(160deg,#1f1e1c,#0b0b0b);border:1px solid var(--gold)}
.ptop{top:0;height:11%;border-radius:4px 4px 0 0;border-bottom:1px dashed rgba(201,164,92,.6);transform-origin:0 100%}
.pbody{top:11%;bottom:0;border-top:0;border-radius:0 0 4px 4px;display:grid;place-content:center;gap:10px;font-family:var(--serif)}
.pbody i{font-style:normal;color:var(--gold);font-size:2.6rem;line-height:1}
.pbody b{font-weight:300;font-size:1.5rem;letter-spacing:.12em;font-style:italic}
.glow{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,214,.9),rgba(201,164,92,.35) 40%,transparent 70%);filter:blur(10px);z-index:-1}
.pack.shake{animation:shake var(--dur,2400ms) ease-in forwards}
.pack.shake .glow{animation:swell var(--dur,2400ms) ease-in forwards}
.pack.torn{animation:none}
.torn .ptop{animation:flyTop .5s ease-in forwards}
.torn .pbody{animation:dropBody .6s ease-in .05s forwards}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shake{0%{transform:translate(0)}10%{transform:translate(-1px,0) rotate(-.3deg)}20%{transform:translate(1px,1px) rotate(.4deg)}30%{transform:translate(-2px,0) rotate(-.7deg)}40%{transform:translate(2px,-1px) rotate(.9deg)}50%{transform:translate(-3px,1px) rotate(-1.3deg)}60%{transform:translate(3px,0) rotate(1.6deg)}70%{transform:translate(-5px,-1px) rotate(-2deg)}80%{transform:translate(5px,1px) rotate(2.4deg)}90%{transform:translate(-6px,0) rotate(-2.8deg)}100%{transform:translate(6px,0) rotate(3deg) scale(1.06)}}
@keyframes swell{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1.5)}}
@keyframes flyTop{to{transform:translate(60px,-150px) rotate(35deg);opacity:0}}
@keyframes dropBody{to{transform:translateY(90px) scale(.92);opacity:0}}
.rev{position:relative;display:grid;place-items:center}
.rev .card{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;z-index:1}
.rev .card.up{cursor:default}
.aura{position:absolute;width:140%;aspect-ratio:1;border-radius:50%;filter:blur(28px);animation:pulse 1.8s ease-in-out infinite alternate;pointer-events:none}
.aura.n{background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.aura.g{background:radial-gradient(circle,rgba(201,164,92,.8),transparent 65%)}
.aura.p{background:conic-gradient(#ff9ad5,#ffe29a,#9affd4,#9ad0ff,#c79aff,#ff9ad5);opacity:.6;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:pulse 1.8s ease-in-out infinite alternate,hue 6s linear infinite}
@keyframes rise{from{transform:translateY(70px) scale(.7);opacity:0}}
@keyframes pulse{from{transform:scale(.85);opacity:.6}to{transform:scale(1.05);opacity:1}}
#hint,#msg{min-height:1.6em;margin:12px 0 0;color:var(--mute);font-size:.95rem}
#msg{font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--ink);margin-top:4px}
#again{font:inherit;background:none;color:var(--gold);border:1px solid var(--gold);padding:10px 26px;border-radius:2px;cursor:pointer;display:none;margin-top:12px;letter-spacing:.04em}

/* album */
.binder{max-width:560px;margin:0 auto;background:#121212;border:1px solid var(--line);border-left:14px solid #1d1c1a;border-radius:6px;padding:18px 14px;position:relative}
.binder::before{content:"";position:absolute;left:-10px;top:12%;bottom:12%;width:6px;background:radial-gradient(circle,var(--gold) 0 2px,transparent 3px) 0 0/6px 33%;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:var(--r);border-radius:4.3%/2.4%;border:1px solid var(--line);background:#090909;display:grid;place-items:center;color:#3d3a35;font-family:var(--serif);font-size:1.4rem}
.slot .card{width:100%;height:100%}
.slot.has{cursor:pointer;border-color:transparent}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}
.pager button{font:inherit;background:none;color:var(--gold);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer}
.pager button:disabled{opacity:.25;cursor:default}
#pgtitle{min-width:190px;font-family:var(--serif);font-style:italic;font-size:1.2rem}
#count{color:var(--mute);margin:14px 0 0;font-size:.88rem}
#zoom{position:fixed;inset:0;background:rgba(6,6,6,.92);display:none;place-items:center;z-index:9}
#cname{font-family:var(--serif);font-size:1.9rem;font-weight:300;letter-spacing:.06em;margin-top:14px;min-height:1.2em}
.cnt{position:absolute;right:6px;bottom:6px;z-index:2;background:rgba(10,10,10,.85);color:var(--gold);border:1px solid rgba(201,164,92,.5);border-radius:99px;padding:1px 8px;font-size:.78rem;pointer-events:none}
.zc{color:var(--gold);font-family:var(--serif);font-style:italic;font-size:1.2rem}
#zoom.on{display:grid;place-content:center;justify-items:center;gap:14px}#zoom .card{width:min(320px,78vw)}
@media (prefers-reduced-motion:reduce){.pack,.aura,.prism .spark,.prism .pearl{animation:none}}
</style>
</head>
<body>
<nav><button id="t1" class="on">Abrir un sobre</button><button id="t2">Mi álbum</button></nav>

<section id="v1" class="view on">
  <h1>Un sobre para ti</h1>
  <p class="sub">Algunas cartas brillan más que otras.</p>
  <div id="stage"></div>
  <div id="hint"></div>
  <div id="cname"></div>
  <div id="msg"></div>
  <button id="again">Abrir otro sobre</button>
</section>

<section id="v2" class="view">
  <h1>Tu álbum</h1>
  <p class="sub">Toca una carta para verla en grande.</p>
  <div class="binder"><div class="grid" id="grid"></div></div>
  <div class="pager"><button id="prev" aria-label="Página anterior">&#8592;</button><span id="pgtitle"></span><button id="next" aria-label="Página siguiente">&#8594;</button></div>
  <p id="count"></p>
</section>
<div id="zoom"></div>

const $ = s => document.querySelector(s);
const KINDS = ["n","g","p"];
const LABEL = {n:"Clásica", g:"Edición dorada", p:"Edición prismática"};
let owned = {};
try { owned = JSON.parse(localStorage.getItem("tcg-gift") || "{}"); } catch(e){}
const save = () => { try { localStorage.setItem("tcg-gift", JSON.stringify(owned)); } catch(e){} };

function cardEl(i, kind, up){
  const c = CARDS[i], el = document.createElement("div");
  el.className = "card" + (kind==="g" ? " gold" : kind==="p" ? " prism" : "") + (up ? " up" : "");
  const art = c.img ? `<img src="${c.img}" alt="${c.name}">` : `<div class="ph">${i+1}</div>`;
  el.innerHTML = `<div class="inner"><div class="face">${art}<div class="pearl"></div><div class="shine"></div><div class="spark"></div></div><div class="back">&#9790;</div></div>`;
  const inner = el.querySelector(".inner"), sh = el.querySelector(".shine");
  el.addEventListener("pointermove", e => {
    if(!el.classList.contains("up")) return;
    const r = el.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
    sh.style.setProperty("--mx", x*100+"%"); sh.style.setProperty("--my", y*100+"%");
    el.querySelector(".pearl").style.setProperty("--a", x*360);
    inner.style.transform = `rotateY(${(x-.5)*24}deg) rotateX(${(.5-y)*24}deg)`;
  });
  el.addEventListener("pointerleave", () => { inner.style.transform = ""; });
  return el;
}

function pick(){
  const w = CARDS.map((_, i) => SECRET.includes(i) ? SECRET_WEIGHT : 1);
  let r = Math.random() * w.reduce((a, b) => a + b);
  for(let i = 0; i < w.length; i++){ if((r -= w[i]) < 0) return i; }
  return 0;
}
function showPack(){
  $("#again").style.display = "none"; $("#msg").textContent = ""; $("#cname").textContent = ""; $("#hint").textContent = "Toca el sobre para abrirlo";
  const p = document.createElement("div");
  p.className = "pack";
  p.innerHTML = `<div class="glow"></div><div class="ptop"></div><div class="pbody"><i>&#9790;</i><b>${TITRE_PACK}</b></div>`;
  p.onclick = () => tear(p);
  $("#stage").replaceChildren(p);
}

function tear(p){
  p.onclick = null;
  const r = Math.random(), kind = r < P_PRISM ? "p" : r < P_PRISM + P_GOLD ? "g" : "n";
  const i = pick();
  const dur = {n:1200, g:1700, p:2200}[kind];
  p.style.setProperty("--dur", dur+"ms");
  p.classList.add("shake");
  $("#hint").textContent = "";
  setTimeout(() => { p.classList.remove("shake"); p.classList.add("torn"); }, dur);
  setTimeout(() => emerge(i, kind), dur + 550);
}

function emerge(i, kind){
  const card = cardEl(i, kind, false), w = document.createElement("div");
  w.className = "rev"; w.innerHTML = `<div class="aura ${kind}"></div>`; w.appendChild(card);
  $("#stage").replaceChildren(w);
  $("#hint").textContent = "";
  setTimeout(() => {
    card.classList.add("flipping", "up");
    setTimeout(() => {
      card.classList.remove("flipping");
      const o = owned[i] || {n:0,g:0,p:0}, isNew = !o[kind];
      o[kind]++; owned[i] = o; save();
      $("#cname").textContent = ROMAN[i] + " · " + CARDS[i].name;
      const parts = [];
      if(SECRET.includes(i)) parts.push("Carta secreta");
      if(kind !== "n") parts.push(LABEL[kind]);
      parts.push(isNew ? "Carta nueva" : "Ya la tenías");
      $("#msg").textContent = parts.join(". ") + ".";
      $("#again").style.display = "inline-block";
    }, 1000);
  }, 850);
}

let page = 0;
function renderBinder(){
  const g = $("#grid"); g.replaceChildren();
  const kind = KINDS[page], c = {n:0,g:0,p:0};
  CARDS.forEach((_, i) => {
    const o = owned[i] || {n:0,g:0,p:0}, s = document.createElement("div");
    s.className = "slot";
    KINDS.forEach(k => c[k] += o[k] ? 1 : 0);
    if(o[kind]){
      s.classList.add("has"); s.appendChild(cardEl(i, kind, true));
      const b = document.createElement("span"); b.className = "cnt"; b.textContent = "×" + o[kind]; s.appendChild(b);
      s.onclick = () => { const z = $("#zoom"), cap = document.createElement("div"); cap.className = "zc"; cap.textContent = ROMAN[i] + " · " + CARDS[i].name + " — ×" + o[kind]; z.replaceChildren(cardEl(i, kind, true), cap); z.classList.add("on"); };
    } else s.textContent = SECRET.includes(i) ? "?" : ["I","II","III","IV","V","VI","VII","VIII","IX"][i];
    g.appendChild(s);
  });
  $("#pgtitle").textContent = ["Página 1 · Clásicas","Página 2 · Doradas","Página 3 · Prismáticas"][page];
  $("#prev").disabled = page === 0; $("#next").disabled = page === 2;
  const n = CARDS.length;
  $("#count").textContent = `${c.n}/${n} clásicas · ${c.g}/${n} doradas · ${c.p}/${n} prismáticas`;
}
$("#prev").onclick = () => { page--; renderBinder(); };
$("#next").onclick = () => { page++; renderBinder(); };
$("#zoom").onclick = e => { if(e.target.id === "zoom") e.currentTarget.classList.remove("on"); };
$("#again").onclick = showPack;
function tab(k){
  $("#v1").classList.toggle("on", k===1); $("#v2").classList.toggle("on", k===2);
  $("#t1").classList.toggle("on", k===1); $("#t2").classList.toggle("on", k===2);
  if(k===2) renderBinder();
}
$("#t1").onclick = () => tab(1); $("#t2").onclick = () => tab(2);
showPack();
</script>
</body>
</html>
