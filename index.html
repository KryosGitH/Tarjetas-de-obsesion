<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu sobre sorpresa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0c0c0c;--ink:#e9e4d8;--mute:#7f7a70;--line:#2a2927;--gold:#c9a45c;--r:387/696;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Jost',system-ui,Helvetica,Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1d1c1a,var(--bg) 65%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;text-align:center;overflow-x:hidden}
nav{display:flex;gap:30px;justify-content:center;padding:22px 16px 6px}
nav button{font:inherit;font-size:.95rem;letter-spacing:.04em;background:none;color:var(--mute);border:0;border-bottom:1px solid transparent;padding:6px 2px;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--gold)}
.view{display:none;padding:18px 16px 50px}.view.on{display:block}
h1{font-family:var(--serif);font-weight:300;font-size:2.1rem;margin:10px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* carta */
.card{width:min(250px,64vw);aspect-ratio:var(--r);position:relative;perspective:900px;display:inline-block;border-radius:4.3%/2.4%}
.inner{position:absolute;inset:0;border-radius:4.3%/2.4%;transform-style:preserve-3d;transition:transform .15s;transform:rotateY(180deg)}
.card.up .inner{transform:rotateY(0)}
.card.flipping .inner{transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.face,.back{position:absolute;inset:0;border-radius:4.3%/2.4%;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg);background:#111;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:2.4rem;font-family:var(--serif)}
.back::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.35);border-radius:7px}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:3rem}
.shine,.pearl,.spark{position:absolute;inset:0;pointer-events:none;opacity:0}
.shine{mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.7) 45%,rgba(255,235,170,.55) 55%,transparent 80%);background-size:250% 250%;background-position:var(--mx,0%) var(--my,0%)}
.card.up:hover .shine{opacity:.35}
.card:not(.up) .shine,.card:not(.up) .pearl,.card:not(.up) .spark,.card.flipping .shine,.card.flipping .pearl,.card.flipping .spark,.card:not(.up) .face::after,.card.flipping .face::after{display:none}
.tag{position:absolute;left:0;right:0;bottom:0;padding:7px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:var(--serif);font-style:italic;font-size:.95rem;display:none}
/* dorada */
.gold .face img,.gold .ph{filter:contrast(1.04) brightness(1.04)}
.gold.up:not(.flipping){filter:drop-shadow(0 0 14px rgba(235,185,60,.8))}
.gold .shine{opacity:1}.gold .tag{display:block;color:var(--gold)}
/* prismatica */
.prism .face img,.prism .ph{filter:saturate(1.15) brightness(1.02) contrast(1.08)}
.prism.up:not(.flipping){filter:drop-shadow(0 0 14px rgba(190,170,255,.65))}
.prism .pearl{opacity:.75;mix-blend-mode:color;background:conic-gradient(from calc(var(--a,0)*1deg),#ff9ad5,#ffe29a,#9affd4,#9ad0ff,#c79aff,#ff9ad5);animation:hue 7s linear infinite}
.prism .face::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,225,245,.05) 40%,rgba(205,240,255,.16))}
.prism .shine{opacity:.85;mix-blend-mode:screen;background-size:220% 220%;background-image:linear-gradient(115deg,transparent 22%,rgba(255,140,220,.5) 38%,rgba(140,230,255,.55) 50%,rgba(180,150,255,.5) 62%,transparent 78%)}
.prism .spark{opacity:.9;mix-blend-mode:color-dodge;background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2.5px),radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 3px),radial-gradient(circle at 45% 85%,#fff 0 1px,transparent 2.5px);background-size:61px 67px,83px 79px,47px 53px;animation:twinkle 2.2s ease-in-out infinite alternate}
.prism .spark::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,#fff 0 1px,transparent 2.5px),radial-gradient(circle at 30% 55%,#fff 0 1.5px,transparent 3px);background-size:71px 59px,53px 89px;animation:twinkle 1.7s ease-in-out -.8s infinite alternate}
.prism .tag{display:block;color:#fff}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.prism .spark,.prism .spark::after{display:none!important}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}

/* sobre */
#stage{min-height:430px;display:grid;place-items:center;position:relative;margin:8px 0}
.pack{width:min(200px,54vw);aspect-ratio:5/8;position:relative;cursor:pointer;animation:float 4s ease-in-out infinite}
.ptop,.pbody{position:absolute;left:0;right:0;background:linear-gradient(160deg,#1f1e1c,#0b0b0b);border:1px solid var(--gold)}
.ptop{top:0;height:11%;border-radius:4px 4px 0 0;border-bottom:1px dashed rgba(201,164,92,.6);transform-origin:0 100%}
.pbody{top:11%;bottom:0;border-top:0;border-radius:0 0 4px 4px;display:grid;place-content:center;gap:10px;font-family:var(--serif)}
.pbody i{font-style:normal;color:var(--gold);font-size:2.6rem;line-height:1}
.pbody b{font-weight:300;font-size:1.5rem;letter-spacing:.12em;font-style:italic}
.glow{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,214,.9),rgba(201,164,92,.35) 40%,transparent 70%);filter:blur(10px);z-index:-1}
.pack.shake{animation:shake var(--dur,2400ms) ease-in forwards}
.pack.shake .glow{animation:swell var(--dur,2400ms) ease-in forwards}
.pack.torn{animation:none}
.torn .ptop{animation:flyTop .5s ease-in forwards}
.torn .pbody{animation:dropBody .6s ease-in .05s forwards}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shake{0%{transform:translate(0)}10%{transform:translate(-1px,0) rotate(-.3deg)}20%{transform:translate(1px,1px) rotate(.4deg)}30%{transform:translate(-2px,0) rotate(-.7deg)}40%{transform:translate(2px,-1px) rotate(.9deg)}50%{transform:translate(-3px,1px) rotate(-1.3deg)}60%{transform:translate(3px,0) rotate(1.6deg)}70%{transform:translate(-5px,-1px) rotate(-2deg)}80%{transform:translate(5px,1px) rotate(2.4deg)}90%{transform:translate(-6px,0) rotate(-2.8deg)}100%{transform:translate(6px,0) rotate(3deg) scale(1.06)}}
@keyframes swell{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1.5)}}
@keyframes flyTop{to{transform:translate(60px,-150px) rotate(35deg);opacity:0}}
@keyframes dropBody{to{transform:translateY(90px) scale(.92);opacity:0}}
.rev{position:relative;display:grid;place-items:center}
.rev .card{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;z-index:1}
.rev .card.up{cursor:default}
.aura{position:absolute;width:140%;aspect-ratio:1;border-radius:50%;filter:blur(28px);animation:pulse 1.8s ease-in-out infinite alternate;pointer-events:none}
.aura.n{background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.aura.g{background:radial-gradient(circle,rgba(201,164,92,.8),transparent 65%)}
.aura.p{background:conic-gradient(#ff9ad5,#ffe29a,#9affd4,#9ad0ff,#c79aff,#ff9ad5);opacity:.6;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:pulse 1.8s ease-in-out infinite alternate,hue 6s linear infinite}
@keyframes rise{from{transform:translateY(70px) scale(.7);opacity:0}}
@keyframes pulse{from{transform:scale(.85);opacity:.6}to{transform:scale(1.05);opacity:1}}
#hint,#msg{min-height:1.6em;margin:12px 0 0;color:var(--mute);font-size:.95rem}
#msg{font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--ink);margin-top:4px}
#again{font:inherit;background:linear-gradient(135deg,#d8b66e,#b8913f);color:#17110a;border:0;padding:13px 34px;border-radius:2px;cursor:pointer;display:none;margin-top:14px;letter-spacing:.05em}

/* album */
.binder{max-width:560px;margin:0 auto;background:#121212;border:1px solid var(--line);border-left:14px solid #1d1c1a;border-radius:6px;padding:18px 14px;position:relative}
.binder::before{content:"";position:absolute;left:-10px;top:12%;bottom:12%;width:6px;background:radial-gradient(circle,var(--gold) 0 2px,transparent 3px) 0 0/6px 33%;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:var(--r);border-radius:4.3%/2.4%;border:1px solid var(--line);background:#090909;display:grid;place-items:center;color:#3d3a35;font-family:var(--serif);font-size:1.4rem}
.slot .card{width:100%;height:100%}
.slot.has{cursor:pointer;border-color:transparent}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}
.pager button{font:inherit;background:none;color:var(--gold);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer}
.pager button:disabled{opacity:.25;cursor:default}
#pgtitle{min-width:190px;font-family:var(--serif);font-style:italic;font-size:1.2rem}
#count{color:var(--mute);margin:14px 0 0;font-size:.88rem}
#zoom{position:fixed;inset:0;background:rgba(6,6,6,.92);display:none;place-items:center;z-index:9}
#cname{font-family:var(--serif);font-size:1.9rem;font-weight:300;letter-spacing:.06em;margin-top:14px;min-height:1.2em}
.cnt{position:absolute;right:6px;bottom:6px;z-index:2;background:rgba(10,10,10,.85);color:var(--gold);border:1px solid rgba(201,164,92,.5);border-radius:99px;padding:1px 8px;font-size:.78rem;pointer-events:none}
.zc{color:var(--gold);font-family:var(--serif);font-style:italic;font-size:1.2rem}
#zoom.on{display:grid;place-content:center;justify-items:center;gap:14px}#zoom .card{width:min(320px,78vw)}
@media (prefers-reduced-motion:reduce){.pack,.aura,.prism .spark,.prism .pearl{animation:none}}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#dl,.zdl{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);padding:10px 22px;border-radius:2px;cursor:pointer;margin-top:12px;letter-spacing:.04em}
#dl{display:none}
#bravo{position:fixed;inset:0;z-index:30;background:rgba(8,8,8,.9);display:grid;place-items:center;animation:fadein .6s both;overflow:hidden;text-align:center}
@keyframes fadein{from{opacity:0}}
#bravo .bt{position:relative;z-index:1;padding:0 24px}
#bravo h2{font-family:var(--serif);font-weight:300;font-size:2.3rem;margin:0 0 8px;color:var(--gold)}
#bravo p{margin:0 0 22px}
#bravo button{font:inherit;background:none;color:var(--gold);border:1px solid var(--gold);padding:10px 26px;border-radius:2px;cursor:pointer}
.rain{position:absolute;inset:0;pointer-events:none}
.rain i{position:absolute;top:-20px;width:5px;height:12px;border-radius:2px;background:var(--gold);opacity:0;animation:fall linear infinite}
.rain i.n{background:#e9e4d8}.rain i.p{background:hsl(var(--h),90%,75%)}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.binder.done{border-color:var(--gold);box-shadow:0 0 24px rgba(201,164,92,.25)}
.acts{flex-direction:column;align-items:center;gap:4px}
#dl{background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:4px;padding:8px;font-size:.9rem;margin-top:6px}
#newtag{display:inline-block;margin:12px 0 2px;padding:7px 24px;border-radius:99px;font-family:var(--serif);font-style:italic;font-size:1.3rem;letter-spacing:.05em;color:#1a1306;background:linear-gradient(110deg,#c9a45c,#f7e3a4 45%,#c9a45c 60%,#e8c46f);background-size:220% 100%;box-shadow:0 0 0 1px rgba(245,224,160,.6),0 0 18px 4px rgba(201,164,92,.55);animation:popin .6s cubic-bezier(.2,1.4,.3,1) both,glowp 2.2s ease-in-out .6s infinite alternate,sheen 3s linear .6s infinite}
#newtag[hidden]{display:none}
#newtag span{font-style:normal;font-size:.8em}
#newtag[data-k=p]{background:linear-gradient(110deg,#ff9ad5,#ffe29a,#9affd4,#9ad0ff,#c79aff,#ff9ad5);background-size:220% 100%;box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 20px 5px rgba(190,170,255,.6)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
@keyframes glowp{to{box-shadow:0 0 0 1px rgba(255,240,190,.95),0 0 32px 10px rgba(201,164,92,.8)}}
@keyframes sheen{to{background-position:-220% 0}}
.slot.excl{grid-column:2}
.pack.locked{opacity:.35;animation:none;cursor:default;filter:grayscale(1)}
.card{touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#secret{margin-top:28px}
.link{font:inherit;background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:.88rem;padding:10px}
#codeBox{display:flex;gap:8px;justify-content:center;margin:6px 0}#codeBox[hidden]{display:none}
#codeIn{font:inherit;font-size:16px;background:#111;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:2px;width:min(220px,52vw)}
#codeOk{font:inherit;background:none;color:var(--gold);border:1px solid var(--gold);padding:10px 16px;border-radius:2px;cursor:pointer}
#codeMsg{min-height:1.2em;color:var(--mute);font-size:.88rem}
@media (max-width:600px){
 nav{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:0;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(12,12,12,.95);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
 nav button{flex:1;padding:15px 4px;font-size:1rem}
 .view{padding:12px 12px 100px}
 h1{font-size:1.7rem}
 .card{width:min(250px,62vw,calc(46dvh*387/696))}
 .pack{width:min(190px,52vw,calc(42dvh*5/8))}
 #stage{min-height:min(440px,56dvh)}
 .binder{padding:12px 8px;border-left-width:10px}
 .grid{gap:6px}
 .acts{align-items:center}
 #again{width:auto;min-width:min(240px,70vw);padding:15px 30px}
 #dl{padding:10px}
 #pgtitle{min-width:0;flex:1;font-size:1.05rem}
 #cname{font-size:1.6rem}
}
</style>
</head>
<body>
<nav><button id="t1" class="on">Abrir un sobre</button><button id="t2">Mi álbum</button></nav>

<section id="v1" class="view on">
  <h1>Puedes abrir un sobre</h1>
  <p class="sub" id="sub"></p>
  <div id="stage"></div>
  <div id="hint"></div>
  <div id="cname"></div>
  <div id="newtag" hidden><span>✦</span> Carta nueva <span>✦</span></div>
  <div id="msg"></div>
  <div class="acts"><button id="again">Abrir otro sobre</button><button id="dl">Descargar la carta</button></div>
  <div id="secret">
    <button id="codeLink" class="link">¿Tienes un código secreto?</button>
    <div id="codeBox" hidden><input id="codeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código secreto"><button id="codeOk">Validar</button></div>
    <div id="codeMsg"></div>
    <button id="classic" class="link" hidden>Volver al modo clásico</button>
  </div>
</section>

<section id="v2" class="view">
  <h1>Tu álbum</h1>
  <p class="sub">Toca una carta para verla en grande.</p>
  <div class="binder"><div class="grid" id="grid"></div></div>
  <div class="pager"><button id="prev" aria-label="Página anterior">&#8592;</button><span id="pgtitle"></span><button id="next" aria-label="Página siguiente">&#8594;</button></div>
  <p id="count"></p>
</section>
<div id="zoom"></div>

const $ = s => document.querySelector(s);
const KINDS = ["n","g","p"];
const LABEL = {n:"Clásica", g:"Edición dorada", p:"Edición prismática"};
let owned = {};
try { owned = JSON.parse(localStorage.getItem("tcg-gift") || "{}"); } catch(e){}
const save = () => { try { localStorage.setItem("tcg-gift", JSON.stringify(owned)); } catch(e){} };

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
let daily = {d:today(), used:0}, unlimited = false;
try {
  const s = JSON.parse(localStorage.getItem("tcg-day") || "null"); if(s && s.d === today()) daily = s;
  unlimited = localStorage.getItem("tcg-unl") === "1";
} catch(e){}
const saveDay = () => { try { localStorage.setItem("tcg-day", JSON.stringify(daily)); } catch(e){} };
let last = null, done = {}, moonUsed = false;
try { moonUsed = localStorage.getItem("tcg-moon") === "1"; } catch(e){}
try { done = JSON.parse(localStorage.getItem("tcg-done") || "{}"); } catch(e){}
const vib = v => { try { if(navigator.vibrate) navigator.vibrate(v); } catch(e){} };
function buzz(dur){ const a = []; let t = 0; while(t < dur){ const on = Math.round(20 + 40*t/dur), gap = Math.round(150 - 110*t/dur); a.push(on, gap); t += on + gap; } vib(a); }
function pageStats(kind){
  const list = CARDS.map((c, i) => i).filter(i => kind === "p" ? CARDS[i].only === "p" : !CARDS[i].only);
  return {have: list.filter(i => owned[i] && owned[i][kind]).length, total: list.length};
}
function checkComplete(kind){
  const s = pageStats(kind);
  if(s.have < s.total || done[kind]) return;
  done[kind] = true; try { localStorage.setItem("tcg-done", JSON.stringify(done)); } catch(e){}
  const all = KINDS.every(k => { const x = pageStats(k); return x.have === x.total; });
  setTimeout(() => celebrate(kind, all), 1100);
}
function celebrate(kind, all){
  const names = {n:"clásicas", g:"doradas", p:"prismáticas"};
  const o = document.createElement("div"); o.id = "bravo";
  o.innerHTML = `<div class="rain"></div><div class="bt"><h2>${all ? "Colección completa" : "Página completa"}</h2><p>${all ? "Has reunido todas las cartas, en sus tres ediciones." : (kind === "p" ? "Has encontrado la carta prismática." : "Has reunido todas las cartas " + names[kind] + ".")}</p><button>Seguir</button></div>`;
  const rain = o.querySelector(".rain");
  for(let k = 0; k < 70; k++){
    const s = document.createElement("i"); s.className = kind;
    s.style.left = Math.random()*100 + "%"; s.style.animationDelay = Math.random()*2.5 + "s";
    s.style.animationDuration = (2.5 + Math.random()*2.5) + "s"; s.style.setProperty("--h", Math.floor(Math.random()*360));
    rain.appendChild(s);
  }
  o.onclick = () => o.remove(); document.body.appendChild(o); vib([80,60,80,60,200]);
}
function loadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

    cv.toBlob(b => {
      const u = URL.createObjectURL(b), a = document.createElement("a");
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }, "image/png");
  } catch(e){}
}
const left = () => Math.max(0, MAX_DAILY - daily.used);
function refreshDay(){ if(daily.d !== today()){ daily = {d:today(), used:0}; saveDay(); } }
function updateSub(){
  refreshDay(); const n = left();
  $("#sub").textContent = unlimited ? "Modo ilimitado: abre todos los sobres que quieras."
    : n > 1 ? `Hoy te esperan ${n} sobres.` : n === 1 ? "Hoy te espera 1 sobre." : `Hoy ya has abierto tus ${MAX_DAILY} sobres. Mañana te esperan más.`;
  $("#classic").hidden = !unlimited;
}
function cardEl(i, kind, up){
  const c = CARDS[i], el = document.createElement("div");
  el.className = "card" + (kind==="g" ? " gold" : kind==="p" ? " prism" : "") + (up ? " up" : "");
  const art = c.img ? `<img src="${kind === "g" && c.gold ? c.gold : c.img}" alt="${c.name}">` : `<div class="ph">${i+1}</div>`;
  el.innerHTML = `<div class="inner"><div class="face">${art}<div class="pearl"></div><div class="shine"></div><div class="spark"></div></div><div class="back">&#9790;</div></div>`;
  const inner = el.querySelector(".inner"), sh = el.querySelector(".shine");
  el.addEventListener("pointermove", e => {
    if(!el.classList.contains("up")) return;
    const r = el.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
    sh.style.setProperty("--mx", x*100+"%"); sh.style.setProperty("--my", y*100+"%");
    el.querySelector(".pearl").style.setProperty("--a", x*360);
    inner.style.transform = `rotateY(${(x-.5)*24}deg) rotateX(${(.5-y)*24}deg)`;
  });
  el.addEventListener("pointerleave", () => { inner.style.transform = ""; });
  return el;
}

function pick(kind, guaranteed){
  let w = CARDS.map((c, i) => kind === "p" ? (c.only === "p" ? 1 : 0) : c.only ? 0 : SECRET.includes(i) ? SECRET_WEIGHT : 1);
  if(guaranteed){ const wn = w.map((x, i) => (owned[i] && owned[i][kind]) ? 0 : x); if(wn.some(x => x > 0)) w = wn; }
  let r = Math.random() * w.reduce((a, b) => a + b);
  for(let i = 0; i < w.length; i++){ if((r -= w[i]) < 0) return i; }
  return 0;
}
function showPack(){
  refreshDay(); $("#again").style.display = "none"; $("#dl").style.display = "none"; $("#msg").textContent = ""; $("#cname").textContent = ""; $("#newtag").hidden = true;
  $("#hint").textContent = daily.g ? "Toca el sobre para abrirlo" : "Toca el sobre para abrirlo. El primero del día trae una carta nueva.";
  const p = document.createElement("div");
  p.className = "pack";
  p.innerHTML = `<div class="glow"></div><div class="ptop"></div><div class="pbody"><i>&#9790;</i><b>${TITRE_PACK}</b></div>`;
  p.onclick = () => tear(p);
  updateSub();
  if(!unlimited && left() === 0){ p.onclick = null; p.classList.add("locked"); $("#hint").textContent = "Vuelve mañana para abrir más sobres."; }
  $("#stage").replaceChildren(p);
}

function tear(p){
  p.onclick = null;
  const r = Math.random(), kind = r < P_PRISM ? "p" : r < P_PRISM + P_GOLD ? "g" : "n";
  const guaranteed = !daily.g; daily.g = true;
  const i = pick(kind, guaranteed);
  if(!unlimited) daily.used++;
  saveDay();
  updateSub();
  const dur = {n:1200, g:1700, p:2200}[kind];
  p.style.setProperty("--dur", dur+"ms");
  p.classList.add("shake"); buzz(dur);
  $("#hint").textContent = "";
  setTimeout(() => { p.classList.remove("shake"); p.classList.add("torn"); vib(120); }, dur);
  setTimeout(() => emerge(i, kind), dur + 550);
}

function emerge(i, kind){
  const card = cardEl(i, kind, false), w = document.createElement("div");
  w.className = "rev"; w.innerHTML = `<div class="aura ${kind}"></div>`; w.appendChild(card);
  $("#stage").replaceChildren(w);
  $("#hint").textContent = "";
  setTimeout(() => {
    card.classList.add("flipping", "up");
    setTimeout(() => {
      card.classList.remove("flipping");
      const o = owned[i] || {n:0,g:0,p:0}, isNew = !o[kind];
      o[kind]++; owned[i] = o; save();
      $("#cname").textContent = ROMAN[i] + " · " + CARDS[i].name;
      const parts = [];
      if(CARDS[i].only) parts.push("Carta exclusiva");
      else if(SECRET.includes(i)) parts.push("Carta secreta");
      if(kind !== "n") parts.push(LABEL[kind]);
      if(!isNew) parts.push("Ya la tenías");
      $("#msg").textContent = parts.length ? parts.join(". ") + "." : "";
      const nt = $("#newtag"); nt.dataset.k = kind; nt.hidden = !isNew;
      if(unlimited || left() > 0) $("#again").style.display = "inline-block"; else $("#hint").textContent = "Has abierto tus sobres de hoy. Vuelve mañana.";
      last = {i, kind}; $("#dl").style.display = "inline-block";
      if(kind !== "n") vib([60,50,60]);
      checkComplete(kind);
    }, 1000);
  }, 850);
}

let page = 0;
function renderBinder(){
  const g = $("#grid"); g.replaceChildren();
  const kind = KINDS[page], c = {n:0,g:0,p:0};
  CARDS.forEach((_, i) => {
    if(kind === "p" ? CARDS[i].only !== "p" : CARDS[i].only) return;
    const o = owned[i] || {n:0,g:0,p:0}, s = document.createElement("div");
    s.className = "slot" + (CARDS[i].only ? " excl" : "");
    KINDS.forEach(k => c[k] += o[k] ? 1 : 0);
    if(o[kind]){
      s.classList.add("has"); s.appendChild(cardEl(i, kind, true));
      const b = document.createElement("span"); b.className = "cnt"; b.textContent = "×" + o[kind]; s.appendChild(b);
      s.onclick = () => { const z = $("#zoom"), cap = document.createElement("div"); cap.className = "zc"; cap.textContent = ROMAN[i] + " · " + CARDS[i].name + " — ×" + o[kind]; const d = document.createElement("button"); d.className = "zdl"; d.textContent = "Descargar"; d.onclick = ev => { ev.stopPropagation(); downloadCard(i, kind); };
        z.replaceChildren(cardEl(i, kind, true), cap, d); z.classList.add("on"); };
    } else s.textContent = (SECRET.includes(i) || CARDS[i].only) ? "?" : ROMAN[i];
    g.appendChild(s);
  });
  const st = pageStats(kind), full = st.have === st.total;
  $(".binder").classList.toggle("done", full);
  $("#pgtitle").textContent = ["Página 1 · Clásicas","Página 2 · Doradas","Página 3 · Prismática"][page] + (full ? " ✦" : "");
  $("#prev").disabled = page === 0; $("#next").disabled = page === 2;
  const n = CARDS.filter(x => !x.only).length;
  const sn = pageStats("n"), sg = pageStats("g"), sp = pageStats("p");
  $("#count").textContent = `${sn.have}/${sn.total} clásicas · ${sg.have}/${sg.total} doradas · ${sp.have}/${sp.total} prismática`;
}
$("#prev").onclick = () => { page--; renderBinder(); };
$("#next").onclick = () => { page++; renderBinder(); };
$("#zoom").onclick = e => { if(e.target.id === "zoom") e.currentTarget.classList.remove("on"); };
$("#again").onclick = showPack;
function tab(k){
  $("#v1").classList.toggle("on", k===1); $("#v2").classList.toggle("on", k===2);
  $("#t1").classList.toggle("on", k===1); $("#t2").classList.toggle("on", k===2);
  if(k===2) renderBinder();
}
$("#t1").onclick = () => tab(1); $("#t2").onclick = () => tab(2);
function afterMode(){
  updateSub();
  if(document.querySelector(".pack.shake,.pack.torn")) return;
  if(!document.querySelector(".rev")){ showPack(); return; }
  if($("#cname").textContent === "") return;
  const ok = unlimited || left() > 0;
  $("#again").style.display = ok ? "inline-block" : "none";
  $("#hint").textContent = ok ? "" : "Has abierto tus sobres de hoy. Vuelve mañana.";
}
function setUnl(v){ unlimited = v; try { localStorage.setItem("tcg-unl", v ? "1" : "0"); } catch(e){} afterMode(); }
const MOON_B64 = "bW9vbg=="; // código de la carta prismática
function tryCode(){
  let v = ""; try { v = btoa($("#codeIn").value.trim().toLowerCase()); } catch(e){}
  if(v === CODE_B64){ $("#codeMsg").textContent = "Código correcto: sobres ilimitados."; $("#codeIn").value = ""; $("#codeBox").hidden = true; setUnl(true); }
  else if(v === MOON_B64) grantMoon();
  else $("#codeMsg").textContent = "Código incorrecto.";
}
function grantMoon(){
  const i = CARDS.findIndex(c => c.only === "p");
  if(i < 0) return;
  if(owned[i] && owned[i].p){ $("#codeMsg").textContent = "Ya tienes la carta exclusiva."; return; }
  if(moonUsed){ $("#codeMsg").textContent = "Este código ya se ha usado."; return; }
  if(document.querySelector(".pack.shake,.pack.torn,.card.flipping")){ $("#codeMsg").textContent = "Espera a que termine la apertura."; return; }
  moonUsed = true; try { localStorage.setItem("tcg-moon", "1"); } catch(e){}
  $("#codeIn").value = ""; $("#codeBox").hidden = true; $("#codeMsg").textContent = "Código correcto.";
  $("#again").style.display = "none"; $("#dl").style.display = "none"; $("#msg").textContent = ""; $("#cname").textContent = ""; $("#newtag").hidden = true;
  $("#stage").scrollIntoView({behavior:"smooth", block:"center"});
  emerge(i, "p");
}
$("#codeLink").onclick = () => { $("#codeBox").hidden = !$("#codeBox").hidden; if(!$("#codeBox").hidden) $("#codeIn").focus(); };
$("#codeOk").onclick = tryCode;
$("#dl").onclick = () => { if(last) downloadCard(last.i, last.kind); };
$("#codeIn").addEventListener("keydown", e => { if(e.key === "Enter") tryCode(); });
$("#classic").onclick = () => { $("#codeMsg").textContent = "Modo clásico: 5 sobres al día."; setUnl(false); };
/* Inclinación con el móvil (giroscopio) */
const mo = {on:false, bx:null, by:null, gx:.5, gy:.5, sx:.5, sy:.5, raf:0};
function onOrient(e){
  if(e.gamma == null || e.beta == null) return;
  if(mo.bx === null){ mo.bx = e.gamma; mo.by = e.beta; }
  mo.bx += (e.gamma - mo.bx) * 0.003; mo.by += (e.beta - mo.by) * 0.003;
  mo.gx = Math.min(1, Math.max(0, .5 + (e.gamma - mo.bx) / 40));
  mo.gy = Math.min(1, Math.max(0, .5 - (e.beta - mo.by) / 40));
  if(!mo.raf) mo.raf = requestAnimationFrame(tickMotion);
}
function tickMotion(){
  mo.raf = 0;
  mo.sx += (mo.gx - mo.sx) * .25; mo.sy += (mo.gy - mo.sy) * .25;
  document.querySelectorAll(".card.up:not(.flipping)").forEach(el => {
    const inner = el.querySelector(".inner"), sh = el.querySelector(".shine"), pe = el.querySelector(".pearl");
    sh.style.setProperty("--mx", mo.sx*100 + "%"); sh.style.setProperty("--my", mo.sy*100 + "%");
    pe.style.setProperty("--a", mo.sx*360);
    inner.style.transform = `rotateY(${(mo.sx-.5)*24}deg) rotateX(${(.5-mo.sy)*24}deg)`;
  });
}
async function enableMotion(){
  if(mo.on) return;
  try {
    if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      if(await DeviceOrientationEvent.requestPermission() !== "granted") return;
    }
    window.addEventListener("deviceorientation", onOrient, true);
    mo.on = true;
  } catch(e){}
}
if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
  document.addEventListener("click", enableMotion, {once:true}); // iPhone: pide permiso al primer toque
} else if(window.DeviceOrientationEvent && window.matchMedia("(pointer:coarse)").matches){
  enableMotion();
}
showPack();
</script>
